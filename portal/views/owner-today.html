<div x-data="ownerToday()" x-init="init()">
  <h1 class="text-2xl font-heading uppercase text-jpteal" x-text="t('tab.today')"></h1>

  <template x-if="state === 'loading'">
    <div class="mt-4 space-y-2" aria-label="loading">
      <div class="h-10 bg-slate-100 rounded"></div>
      <div class="h-40 bg-slate-100 rounded"></div>
    </div>
  </template>

  <template x-if="state === 'offline'">
    <div class="mt-4 p-4 rounded-xl bg-red-50 border border-red-300 text-red-700">
      <p x-text="t('state.offline')"></p>
      <button class="mt-2 underline" @click="load()" x-text="t('act.retry')"></button>
    </div>
  </template>

  <template x-if="state === 'not_found' || state === 'error' || state === 'forbidden' || state === 'rate_limited'">
    <div class="mt-4 p-4 rounded-xl bg-red-50 border border-red-300 text-red-700">
      <p x-text="state === 'not_found' ? t('state.not_wired') : t('state.error_body')"></p>
      <button class="mt-2 underline" @click="load()" x-text="t('act.retry')"></button>
    </div>
  </template>

  <template x-if="state === 'ok' || state === 'empty'">
    <div>
      <p class="text-sm text-slate-600 mt-1" x-text="t('today.top', {date: h.fmtDate(date + 'T12:00:00Z'), n: Object.values(byResource).reduce((a,b)=>a+b.filter(x=>x.state!=='blocked').length,0), r: resources.length})"></p>

      <template x-if="alerts.length">
        <div class="mt-3 space-y-2">
          <template x-for="(a, i) in alerts" :key="i">
            <div class="p-3 rounded-xl bg-red-50 border border-red-300 text-red-700 text-sm" x-text="a.message || a.type"></div>
          </template>
        </div>
      </template>

      <div class="mt-3 flex items-center gap-3">
        <button class="px-2 py-1 border border-slate-300 rounded-lg" @click="prevDay()">‹</button>
        <span class="font-heading text-jpteal" x-text="h.fmtDate(date + 'T12:00:00Z')"></span>
        <button class="px-2 py-1 border border-slate-300 rounded-lg" @click="nextDay()">›</button>
        <button x-show="!isToday()" class="ml-auto text-sm underline text-jpteal" @click="jumpToday()" x-text="t('today.jump_today')"></button>
      </div>

      <template x-if="state === 'empty'">
        <p class="mt-3 text-sm text-slate-600" x-text="t('today.empty', {date: h.fmtDate(date + 'T12:00:00Z')})"></p>
      </template>

      <div class="mt-4 overflow-x-auto">
        <div class="flex gap-3 min-w-max">
          <template x-for="r in resources" :key="r.id">
            <div class="w-40 shrink-0">
              <div class="font-heading text-xs uppercase tracking-widest text-slate-500 pb-1" x-text="r.name"></div>
              <div class="mt-2 space-y-1">
                <template x-for="(b, idx) in (byResource[r.id] || [])" :key="(b.id || 'block') + '-' + idx">
                  <button type="button" class="w-full text-left p-2 rounded-lg text-xs" :class="stateClasses(b.state)" @click="open(b)">
                    <template x-if="b.state === 'blocked'">
                      <div>
                        <div class="font-semibold" x-text="b.block.start_time + '–' + b.block.end_time"></div>
                        <div x-text="(b.block.label || t('slot.blocked')) + (b.block.weekly ? ' ↻' : '')"></div>
                      </div>
                    </template>
                    <template x-if="b.state !== 'blocked'">
                      <div>
                        <div class="font-semibold" x-text="h.fmtTime(b.start_at) + '–' + h.fmtTime(b.end_at)"></div>
                        <div x-text="b.walk_in_name || b.display_name || t('today.walk_in')"></div>
                        <div x-show="b.state === 'held'" x-text="t('today.held_until', {time: h.fmtTime(b.end_at)})"></div>
                        <div x-show="b.state === 'confirmed' && b.party_size" x-text="t('today.players', {n: b.party_size})"></div>
                        <div x-show="b.state === 'paid_conflict'" x-text="t('chip.paid_conflict')"></div>
                      </div>
                    </template>
                  </button>
                </template>
                <template x-if="!(byResource[r.id] || []).length">
                  <div class="text-xs text-slate-400 p-2">&mdash;</div>
                </template>
              </div>
            </div>
          </template>
        </div>
      </div>

      <template x-if="sheet">
        <div class="fixed inset-0 bg-black/30 flex items-end md:items-center justify-center z-20" @click.self="close()">
          <div class="bg-white rounded-xl p-4 w-full md:w-[480px] max-h-[90vh] overflow-auto">
            <h2 class="font-heading text-lg text-jpteal" x-text="sheet.state === 'blocked' ? (sheet.block.label || t('slot.blocked')) : (sheet.walk_in_name || sheet.display_name || t('today.walk_in'))"></h2>
            <template x-if="sheet.state !== 'blocked'">
              <p class="text-sm text-slate-600 mt-1" x-text="h.fmtDate(sheet.start_at) + ' · ' + h.fmtTime(sheet.start_at) + '–' + h.fmtTime(sheet.end_at)"></p>
            </template>
            <template x-if="sheet.state === 'blocked'">
              <p class="text-sm text-slate-600 mt-1" x-text="sheet.block.start_time + '–' + sheet.block.end_time"></p>
            </template>
            <p class="text-sm text-slate-600" x-text="'Status: ' + sheet.state"></p>
            <template x-if="sheet.state === 'paid_conflict'">
              <p class="mt-2 text-sm text-red-700" x-text="t('today.conflict_explain', {other: sheet.other_display_name || ''})"></p>
            </template>
            <p x-show="!stripeOn" class="mt-2 text-xs text-slate-500" x-text="t('today.stripe_off_note')"></p>
            <div class="mt-4 flex flex-col gap-2">
              <a x-show="refundUrl(sheet)" :href="refundUrl(sheet)" target="_blank" rel="noopener" class="text-center py-2 rounded-lg border border-jpteal text-jpteal" x-text="t('today.refund')"></a>
              <button x-show="sheet.state !== 'blocked'" class="py-2 rounded-lg border border-red-600 text-red-600" @click="cancel(sheet)" x-text="t('act.cancel')"></button>
              <button class="py-2 rounded-lg border border-slate-300" @click="close()" x-text="t('act.back')"></button>
            </div>
          </div>
        </div>
      </template>
    </div>
  </template>
</div>
