<!-- M5 History (screens.md). Mounted by portal/js/member.js. -->
<section x-data="memberHistory()" x-init="load()">
  <h1 class="font-heading text-2xl text-jpteal" x-text="topLine()"></h1>

  <template x-if="loading">
    <div class="mt-3 space-y-2" aria-busy="true">
      <template x-for="i in 5" :key="i"><div class="h-12 rounded-lg bg-slate-100 animate-pulse"></div></template>
    </div>
  </template>

  <template x-if="!loading && !stripeOn">
    <div class="mt-3 rounded-xl border border-slate-200 bg-slate-50 p-4">
      <p class="font-heading text-jpteal" x-text="t('nc.stripe_title')"></p>
      <p class="text-sm text-slate-600 mt-1" x-text="t('nc.stripe_history_body')"></p>
    </div>
  </template>

  <template x-if="!loading && stripeOn && error">
    <div class="mt-3 rounded-xl border border-[#fca5a5] bg-[#fee2e2] p-4">
      <p class="text-[#b91c1c] text-sm" x-text="t('state.error_title')"></p>
      <button class="mt-2 rounded-lg border border-jpteal px-3 py-1 text-sm text-jpteal" @click="load()" x-text="t('act.retry')"></button>
    </div>
  </template>

  <template x-if="!loading && stripeOn && !error && rows.length === 0">
    <div class="mt-3 text-center py-6">
      <p class="font-heading text-jpteal" x-text="t('history.empty_title')"></p>
      <p class="text-sm text-slate-600 mt-1" x-text="t('history.empty_body')"></p>
    </div>
  </template>

  <template x-if="!loading && stripeOn && !error && rows.length > 0">
    <div class="mt-3 space-y-2">
      <template x-for="(r, i) in rows" :key="i">
        <div class="flex items-center justify-between rounded-lg border border-slate-200 bg-white p-3">
          <div>
            <p class="text-xs text-slate-500" x-text="crDateLabel(r.created_at)"></p>
            <p class="text-sm" x-text="r.kind"></p>
          </div>
          <div class="text-right">
            <p class="font-heading tabular-nums" x-text="money(r.amount_cents)"></p>
            <span class="text-xs uppercase font-heading px-2 py-1 rounded-full inline-block" :class="chipClass(r.status)" x-text="t('history.' + r.status)"></span>
          </div>
        </div>
      </template>
    </div>
  </template>
</section>
