<div x-data="ownerMembers()" x-init="init()">
  <h1 class="text-2xl font-heading uppercase text-jpteal" x-text="t('tab.members')"></h1>

  <template x-if="state === 'loading'">
    <div class="mt-4 space-y-2" aria-label="loading">
      <template x-for="n in 8" :key="n"><div class="h-12 bg-slate-100 rounded"></div></template>
    </div>
  </template>

  <template x-if="state === 'offline' || state === 'not_found' || state === 'error' || state === 'forbidden' || state === 'rate_limited'">
    <div class="mt-4 p-4 rounded-xl bg-red-50 border border-red-300 text-red-700">
      <p x-text="state === 'not_found' ? t('state.not_wired') : t('state.error_body')"></p>
      <button class="mt-2 underline" @click="load()" x-text="t('act.retry')"></button>
    </div>
  </template>

  <template x-if="state === 'empty'">
    <p class="mt-4 text-sm text-slate-600" x-text="t('members.empty')"></p>
  </template>

  <template x-if="state === 'ok'">
    <div>
      <p class="text-sm text-slate-600 mt-1" x-text="t('members.top', {active: activeCount, ending: endingCount})"></p>

      <input type="search" x-model="q" :placeholder="t('members.search')" class="mt-3 w-full border border-slate-300 rounded-lg px-3 py-2" />

      <div class="mt-2 flex gap-2 overflow-x-auto">
        <template x-for="f in ['all','active','ending','past_due','expired','guests','staff']" :key="f">
          <button type="button" class="shrink-0 px-3 py-1 rounded-full text-sm border"
            :class="filter === f ? 'bg-jpteal text-white border-jpteal' : 'border-slate-300 text-slate-600'"
            @click="filter = f" x-text="t('members.f_' + f)"></button>
        </template>
      </div>

      <template x-if="filtered.length === 0">
        <p class="mt-4 text-sm text-slate-600" x-text="t('members.no_match', {q: q})"></p>
      </template>

      <div class="mt-3 divide-y divide-slate-200">
        <template x-for="a in filtered" :key="a.id">
          <a :href="'#/members/' + a.id" class="block py-3">
            <div class="flex justify-between items-baseline">
              <span class="font-semibold text-slate-800" x-text="a.display_name"></span>
              <span class="text-xs px-2 py-0.5 rounded-full border border-slate-300 text-slate-600" x-text="a.entitlement && a.entitlement.tier ? a.entitlement.tier : a.role"></span>
            </div>
            <div class="text-sm text-slate-500 truncate" x-text="a.email"></div>
            <div class="text-xs text-slate-500 mt-0.5" x-text="a.entitlement && a.entitlement.ends_at ? t('members.ends', {date: h.fmtDate(a.entitlement.ends_at)}) : ''"></div>
          </a>
        </template>
      </div>
    </div>
  </template>
</div>
