<!-- M6 Household, read-only (screens.md; D-A02/D-A03: no edit controls here).
     Mounted by portal/js/member.js. -->
<section x-data="memberHousehold()" x-init="load()">
  <h1 class="font-heading text-2xl text-jpteal" x-text="topLine()"></h1>

  <template x-if="loading">
    <div class="mt-3 space-y-2" aria-busy="true">
      <div class="h-10 rounded-lg bg-slate-100 animate-pulse"></div>
      <div class="h-10 rounded-lg bg-slate-100 animate-pulse"></div>
    </div>
  </template>

  <template x-if="!loading && error">
    <div class="mt-3 rounded-xl border border-[#fca5a5] bg-[#fee2e2] p-4">
      <p class="text-[#b91c1c] text-sm" x-text="t('state.error_title')"></p>
      <button class="mt-2 rounded-lg border border-jpteal px-3 py-1 text-sm text-jpteal" @click="load()" x-text="t('act.retry')"></button>
    </div>
  </template>

  <template x-if="!loading && !error && household">
    <div class="mt-3 space-y-4">
      <div class="rounded-xl border border-slate-200 bg-white p-4">
        <p class="text-xs uppercase tracking-widest font-heading text-slate-500">Adults</p>
        <p class="text-sm mt-1" x-text="t('household.you')"></p>
        <template x-if="household.partner">
          <p class="text-sm" x-text="household.partner.display_name"></p>
        </template>
        <template x-if="!household.partner && household.is_couples">
          <p class="text-sm text-slate-500 mt-1" x-text="t('household.no_partner')"></p>
        </template>
        <template x-if="!household.is_couples">
          <p class="text-sm text-slate-500 mt-1" x-text="t('household.single')"></p>
        </template>
      </div>
      <div class="rounded-xl border border-slate-200 bg-white p-4">
        <p class="text-xs uppercase tracking-widest font-heading text-slate-500">Kids</p>
        <template x-if="household.kids.length === 0">
          <p class="text-sm text-slate-500 mt-1">No kids added.</p>
        </template>
        <template x-for="k in household.kids" :key="k.id">
          <div class="flex items-center justify-between mt-1">
            <span class="text-sm" x-text="k.first_name + ' · born ' + k.birth_year"></span>
            <span class="text-xs uppercase font-heading px-2 py-1 rounded-full bg-[#dcfce7] text-[#15803d]" x-text="t('chip.free')"></span>
          </div>
        </template>
        <p class="text-sm text-slate-600 mt-2" x-text="t('household.kid_allowance', {used: household.kids.length, max: household.kid_allowance})"></p>
      </div>
      <p class="text-xs text-slate-500" x-text="t('household.readonly')"></p>
    </div>
  </template>
</section>
