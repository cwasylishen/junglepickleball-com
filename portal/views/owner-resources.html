<div x-data="ownerResources()" x-init="init()">
  <a href="#/manage" class="text-sm text-jpteal underline" x-text="t('act.back')"></a>
  <h1 class="text-2xl font-heading uppercase text-jpteal mt-1" x-text="t('manage.resources')"></h1>

  <template x-if="state === 'loading'">
    <div class="mt-4 space-y-2" aria-label="loading">
      <template x-for="n in 6" :key="n"><div class="h-16 bg-slate-100 rounded"></div></template>
    </div>
  </template>

  <template x-if="state === 'offline' || state === 'not_found' || state === 'error' || state === 'forbidden' || state === 'rate_limited'">
    <div class="mt-4 p-4 rounded-xl bg-red-50 border border-red-300 text-red-700">
      <p x-text="state === 'not_found' ? t('state.not_wired') : t('state.error_body')"></p>
      <button class="mt-2 underline" @click="load()" x-text="t('act.retry')"></button>
    </div>
  </template>

  <template x-if="state === 'ok' || state === 'empty'">
    <div>
      <p class="text-sm text-slate-600 mt-1" x-text="t('res.top', {n: resources.length, d: defaultsCount})"></p>
      <div class="mt-3 space-y-2">
        <template x-for="r in resources" :key="r.id">
          <a :href="'#/manage/resources/' + r.id" class="block p-4 rounded-xl border border-slate-200 bg-white">
            <div class="flex justify-between items-baseline">
              <span class="font-semibold text-slate-800" x-text="r.name"></span>
              <span x-show="(r.unconfirmed_fields || []).length" class="text-xs px-2 py-0.5 rounded-full border border-amber-400 bg-amber-50 text-amber-800" x-text="t('res.n_defaults', {n: (r.unconfirmed_fields || []).length})"></span>
            </div>
            <div class="text-sm text-slate-500" x-text="r.kind + ' · ' + r.slot_minutes + ' min · ' + r.open_time + '–' + r.close_time"></div>
          </a>
        </template>
      </div>
    </div>
  </template>
</div>
