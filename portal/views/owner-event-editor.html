<div x-data="ownerEventEditor()" x-init="init()">
  <a href="#/events" class="text-sm text-jpteal underline" x-text="t('act.back')"></a>
  <h1 class="mt-1 text-2xl font-heading uppercase text-jpteal" x-text="id() ? t('event.edit') : t('event.new')"></h1>
  <p class="mt-1 text-sm text-slate-600">Add the details people need to decide whether to join.</p>

  <template x-if="state === 'loading'">
    <div class="mt-4 h-80 rounded-xl bg-slate-100" aria-busy="true"></div>
  </template>

  <template x-if="state === 'ok'">
    <form class="mt-4 space-y-4" @submit.prevent="save(form.status)">
      <label class="block text-sm font-semibold">
        <span x-text="t('event.title')"></span>
        <input required type="text" maxlength="160" x-model="form.title" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-3" autocomplete="off" />
      </label>
      <div class="grid grid-cols-2 gap-3">
        <label class="block text-sm font-semibold">
          <span x-text="t('event.date')"></span>
          <input required type="date" x-model="form.event_date" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-3" />
        </label>
        <label class="block text-sm font-semibold">
          <span x-text="t('event.time')"></span>
          <input required type="text" maxlength="80" placeholder="5:00 PM to 8:00 PM" x-model="form.event_time" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-3" />
        </label>
      </div>
      <label class="block text-sm font-semibold">
        <span x-text="t('event.place')"></span>
        <input required type="text" maxlength="160" x-model="form.place" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-3" autocomplete="street-address" />
      </label>
      <label class="block text-sm font-semibold">
        <span x-text="t('event.description')"></span>
        <textarea required maxlength="2400" rows="6" x-model="form.description" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-3"></textarea>
      </label>
      <label class="block text-sm font-semibold">
        <span x-text="t('event.image')"></span>
        <input type="file" accept="image/png,image/jpeg,image/webp" @change="readImage($event)" class="mt-1 block w-full rounded-lg border border-slate-300 bg-white px-3 py-3 text-sm" />
        <span class="mt-1 block text-xs font-normal text-slate-500" x-text="t('event.image_help')"></span>
      </label>
      <template x-if="imagePreview">
        <img :src="imagePreview" alt="Event image preview" class="max-h-64 w-full rounded-xl border border-slate-200 object-cover" />
      </template>
      <label class="block text-sm font-semibold">
        <span x-text="t('event.signup')"></span>
        <input type="url" maxlength="500" placeholder="https:// or /signup" x-model="form.signup_url" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-3" inputmode="url" />
      </label>
      <label class="block text-sm font-semibold">
        <span x-text="t('event.price')"></span>
        <input type="text" maxlength="120" placeholder="$20 per person" x-model="form.price_text" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-3" />
      </label>
      <label class="block text-sm font-semibold">
        <span x-text="t('event.status')"></span>
        <select x-model="form.status" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-3">
          <option value="draft" x-text="t('events.draft')"></option>
          <option value="published" x-text="t('events.published')"></option>
        </select>
      </label>

      <p x-show="error" class="rounded-lg border border-red-300 bg-red-50 p-3 text-sm text-red-700" x-text="messageFor(error)"></p>
      <div class="flex flex-col gap-2 pb-4">
        <button type="button" class="w-full rounded-lg bg-jpyellow py-3 font-heading uppercase text-black" :disabled="saveState === 'saving'" @click="save('published')" x-text="saveState === 'saving' ? t('event.saving') : t('event.publish')"></button>
        <button type="button" class="w-full rounded-lg border border-jpteal py-3 font-heading uppercase text-jpteal" :disabled="saveState === 'saving'" @click="save('draft')" x-text="t('event.save_draft')"></button>
      </div>
    </form>
  </template>
</div>
