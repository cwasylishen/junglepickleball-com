<div x-data="ownerEvents()" x-init="init()">
  <div class="flex items-start justify-between gap-3">
    <div>
      <h1 class="text-2xl font-heading uppercase text-jpteal" x-text="t('nav.events')"></h1>
      <p class="text-sm text-slate-600 mt-1" x-text="t('events.top')"></p>
    </div>
    <a href="#/events/new" class="shrink-0 rounded-lg bg-jpyellow px-3 py-2 text-sm font-heading uppercase text-black" x-text="t('events.add')"></a>
  </div>

  <template x-if="state === 'loading'">
    <div class="mt-4 space-y-2" aria-busy="true">
      <div class="h-24 rounded-xl bg-slate-100"></div>
      <div class="h-24 rounded-xl bg-slate-100"></div>
    </div>
  </template>

  <template x-if="state === 'error' || state === 'offline' || state === 'forbidden'">
    <div class="mt-4 rounded-xl border border-red-300 bg-red-50 p-4 text-red-700">
      <p x-text="t('state.error_body')"></p>
      <button type="button" class="mt-2 underline" @click="load()" x-text="t('act.retry')"></button>
    </div>
  </template>

  <template x-if="state === 'empty'">
    <div class="mt-4 rounded-xl border border-dashed border-slate-300 bg-white p-6 text-center">
      <p class="text-sm text-slate-600" x-text="t('events.empty')"></p>
      <a href="#/events/new" class="mt-3 inline-block rounded-lg bg-jpyellow px-4 py-2 font-heading uppercase text-sm text-black" x-text="t('events.add')"></a>
    </div>
  </template>

  <div x-show="state === 'ok'" class="mt-4 space-y-3">
    <template x-for="event in events" :key="event.id">
      <article class="rounded-xl border border-slate-200 bg-white p-4">
        <div class="flex items-start justify-between gap-3">
          <div class="min-w-0">
            <h2 class="font-heading text-xl text-jpteal" x-text="event.title"></h2>
            <p class="mt-1 text-sm text-slate-600" x-text="event.date + ' · ' + event.time"></p>
            <p class="text-sm text-slate-500" x-text="event.place"></p>
          </div>
          <span class="shrink-0 rounded-full border px-2 py-1 text-xs font-heading uppercase" :class="event.status === 'published' ? 'border-green-300 bg-green-50 text-green-700' : 'border-slate-300 bg-slate-50 text-slate-600'" x-text="statusLabel(event)"></span>
        </div>
        <p class="mt-3 text-sm text-slate-600 line-clamp-3" x-text="event.description"></p>
        <div class="mt-4 flex gap-2">
          <a :href="'#/events/' + event.id" class="flex-1 rounded-lg border border-jpteal py-2 text-center text-sm font-heading uppercase text-jpteal" x-text="t('events.edit')"></a>
          <button type="button" class="rounded-lg border border-red-300 px-3 py-2 text-sm text-red-700" @click="remove(event)" x-text="t('events.delete')"></button>
        </div>
      </article>
    </template>
  </div>
</div>
